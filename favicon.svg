<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient for dark/light tab contrast -->
    <radialGradient id="tabBg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1E2732"/>
      <stop offset="100%" stop-color="#0E1318"/>
    </radialGradient>

    <!-- Vintage Saddle Leather Gradient -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542B12"/>
      <stop offset="50%" stop-color="#42200B"/>
      <stop offset="100%" stop-color="#2D1405"/>
    </linearGradient>

    <!-- Spine Leather Gradient -->
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#281103"/>
      <stop offset="60%" stop-color="#3D1C08"/>
      <stop offset="100%" stop-color="#220D02"/>
    </linearGradient>

    <!-- Antique Brass / Gold Gradient -->
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#996E14"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>

    <filter id="albumDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tabBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#brassGold)" stroke-width="1.2" stroke-opacity="0.6"/>

  <g filter="url(#albumDropShadow)">
    <!-- Book Pages (cream paper visible along right edge) -->
    <path d="M 14 11 L 49 11 A 2 2 0 0 1 51 13 L 51 51 A 2 2 0 0 1 49 53 L 14 53 Z" fill="#F4EBD7"/>
    <line x1="49" y1="13" x2="49" y2="51" stroke="#D3C5AB" stroke-width="0.8"/>
    <line x1="47.5" y1="13" x2="47.5" y2="51" stroke="#D3C5AB" stroke-width="0.5"/>

    <!-- Silk Ribbon Bookmark hanging at bottom -->
    <polygon points="28,50 33,50 33,58 30.5,55.5 28,58" fill="#D4AF37" stroke="#996E14" stroke-width="0.5"/>

    <!-- Album Front Cover: Vintage Leather -->
    <rect x="12" y="10" width="37" height="44" rx="3.5" fill="url(#leatherGrad)" stroke="#6E3B1B" stroke-width="0.8"/>

    <!-- Leather Debossed Inner Border Line -->
    <rect x="19" y="12.5" width="27.5" height="39" rx="1.5" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.45"/>

    <!-- Book Spine on Left -->
    <path d="M 12 10 L 18 10 L 18 54 L 12 54 A 3.5 3.5 0 0 1 12 10 Z" fill="url(#spineGrad)" stroke="#542B12" stroke-width="0.6"/>
    <!-- Spine Gold Stitched Ribs (Gân gáy sách da cổ điển) -->
    <rect x="13" y="16" width="4.5" height="1.6" rx="0.5" fill="url(#brassGold)"/>
    <rect x="13" y="31.2" width="4.5" height="1.6" rx="0.5" fill="url(#brassGold)"/>
    <rect x="13" y="46.4" width="4.5" height="1.6" rx="0.5" fill="url(#brassGold)"/>

    <!-- 4 GÓC BỌC ĐỒNG VÀNG (Brass Corner Protectors) -->
    <!-- Top-Left -->
    <polygon points="12,10 18,10 18,12 14,16 12,16" fill="url(#brassGold)"/>
    <circle cx="14.5" cy="12.5" r="0.7" fill="#FFF2A3"/>
    <!-- Top-Right -->
    <polygon points="49,10 43,10 43,12 47,16 49,16" fill="url(#brassGold)"/>
    <circle cx="46.5" cy="12.5" r="0.7" fill="#FFF2A3"/>
    <!-- Bottom-Left -->
    <polygon points="12,54 18,54 18,52 14,48 12,48" fill="url(#brassGold)"/>
    <circle cx="14.5" cy="51.5" r="0.7" fill="#FFF2A3"/>
    <!-- Bottom-Right -->
    <polygon points="49,54 43,54 43,52 47,48 49,48" fill="url(#brassGold)"/>
    <circle cx="46.5" cy="51.5" r="0.7" fill="#FFF2A3"/>

    <!-- KHUNG ẢNH KỶ NIỆM GẮN GIỮA BÌA ALBUM -->
    <rect x="22" y="17" width="20" height="23" rx="1.5" fill="#201108" stroke="url(#brassGold)" stroke-width="0.8"/>
    <!-- Photo Card (White/Cream border) -->
    <rect x="23.5" y="18.5" width="17" height="20" rx="0.8" fill="#FFFDF8"/>
    <!-- Photo image area -->
    <rect x="24.8" y="19.8" width="14.4" height="14" fill="#283340"/>
    
    <!-- Photo landscape silhouette & sun -->
    <circle cx="36" cy="23" r="1.8" fill="#F5C444"/>
    <polygon points="24.8,33.8 28.5,27.5 32,31 35.5,26.5 39.2,33.8" fill="#B58655"/>
    
    <!-- 4 Vintage Photo Mount Corners (Góc gài ảnh) -->
    <polygon points="23.5,18.5 25.5,18.5 23.5,20.5" fill="#2D1506"/>
    <polygon points="40.5,18.5 38.5,18.5 40.5,20.5" fill="#2D1506"/>
    <polygon points="23.5,38.5 25.5,38.5 23.5,36.5" fill="#2D1506"/>
    <polygon points="40.5,38.5 38.5,38.5 40.5,36.5" fill="#2D1506"/>

    <!-- Dập nổi biểu tượng bên dưới khung ảnh -->
    <line x1="25" y1="44" x2="39" y2="44" stroke="url(#brassGold)" stroke-width="0.7"/>
    <circle cx="32" cy="44" r="0.9" fill="#FFF2A3"/>
  </g>
</svg>
